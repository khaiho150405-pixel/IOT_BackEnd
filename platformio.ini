[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32 @ 6.10.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/windows_paths.py
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_src_filter = +<main.cpp>
; Conservative upload speed while establishing a reliable USB/bootloader link.
upload_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    ; Serial uses native USB Serial/JTAG; verify the port using device IDs.
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/DHT sensor library @ 1.4.6
    adafruit/Adafruit Unified Sensor @ 1.1.15
    adafruit/Adafruit SSD1306 @ 2.5.13
    adafruit/Adafruit GFX Library @ 1.12.1
    fastled/FastLED @ 3.9.15
    bblanchon/ArduinoJson @ 6.21.5
    links2004/WebSockets @ 2.6.1

; Isolated USB test: no WiFi, peripherals, credentials or PSRAM dependency.
[env:usb-diagnostic]
platform = espressif32 @ 6.10.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/windows_paths.py
board_build.flash_mode = dio
board_upload.flash_size = 8MB
build_src_filter = +<usb_diagnostic.cpp>
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
upload_speed = 115200
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

; Isolated OLED panel test; upload temporarily replaces the AIoT firmware.
[env:oled-test]
platform = espressif32 @ 6.10.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/windows_paths.py
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_src_filter = +<oled_test.cpp>
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit SSD1306 @ 2.5.13
    adafruit/Adafruit GFX Library @ 1.12.1
upload_speed = 115200
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
